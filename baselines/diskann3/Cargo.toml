[package]
name = "diskann3"
description = "DiskANN from the diskann-disk crate with two macOS readers, as a library for the benchmark adapter and a build tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A C library for the Python adapter, and the Rust library that the build tool and the tests use.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "diskann3"
path = "src/bin/diskann3.rs"
doc = false

[dependencies]
# The index itself. The versions are pinned, so every result names the exact library.
diskann = "=0.60.0"
diskann-disk = "=0.60.0"
diskann-providers = "=0.60.0"
diskann-quantization = { version = "=0.60.0", default-features = false }
diskann-vector = "=0.60.0"
# libc: F_NOCACHE and F_RDADVISE.
libc = "0.2.190"
# serde_json: the build tool's report and the index's meta.json.
serde_json = "1.0.151"
# tokio: the single-thread runtime that DiskIndexSearcher runs its searches on.
tokio = { version = "1.53.2", default-features = false, features = ["rt"] }
# tracing: the builder logs its stage times as events, which the build tool records.
tracing = "0.1.44"
