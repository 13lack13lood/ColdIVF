[package]
name = "coldivf-python"
description = "ColdIVF's Python module, coldivf, built with maturin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "coldivf_python"
crate-type = ["cdylib"]
# The module finds Python's symbols only once Python loads it, so cargo can't link a test of it. tests/test_coldivf.py
# tests it through Python instead.
test = false
doctest = false

[features]
default = ["python"]
# The module itself. The cross targets of scripts/check-all.sh build without default features, and so without it,
# since pyo3's build script needs a Python for the target.
python = ["dep:pyo3"]

[dependencies]
coldivf.workspace = true
# pyo3: the Python module, on Python's stable ABI from 3.11 on, the first with buffers in it, so one build serves every
# later Python and cross-compiles without the target's Python.
pyo3 = { version = "0.29.3", optional = true, features = ["extension-module", "abi3-py311"] }
