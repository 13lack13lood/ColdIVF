[package]
name = "coldivf"
description = "One-file IVF over 1-bit RaBitQ FastScan postings with an SQ8 rerank tier, built for cold queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes the in-RAM reference index to benchmark binaries.
inmem = []
# Times each stage of a search into `SearchCtx::trace`, and exposes the control paths that benchmarks compare with.
bench = []

# The command line tool. It shares the library's name, so only the library gets docs.
[[bin]]
name = "coldivf"
path = "src/bin/coldivf.rs"
doc = false

# Counts allocations with its own allocator, so it runs as its own program.
[[test]]
name = "alloc"
path = "tests/alloc.rs"
harness = false

[dependencies]
# Pure Rust only, so the Mac can cross-compile and check every target.
# libm: a correctly rounded fused multiply-add that gives the same bits on every platform.
libm = "0.2.16"
# zerocopy: the index file's header and tables as little-endian structs with no hidden padding.
zerocopy = { version = "0.8.60", features = ["derive"] }
# crc32fast: checksums of the index file's sections.
crc32fast = "1.5.0"
# memmap2: maps an index file into memory.
memmap2 = "0.9.11"
# faer: the matrix products that find each vector's nearest cluster center during k-means.
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon"] }
# rayon: the build's threads, for k-means and encoding.
rayon = "1.12.0"
# arc-swap: the generation that each open index holds now, which searches load without a lock and a commit swaps.
arc-swap = "1.9.2"

[target.'cfg(unix)'.dependencies]
# libc: F_NOCACHE and F_RDADVISE for the macOS reader, O_DIRECT, statx, posix_fadvise and MADV_POPULATE_READ for the
# Linux one, and pthread_set_qos_class_self_np (macOS) and setpriority (Linux) for low-priority warm-ups.
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
# io-uring: the Linux backend for batched reads.
io-uring = "0.7.15"

[target.'cfg(windows)'.dependencies]
# windows-sys: the Windows backend for batched reads, using IoRing or I/O completion ports (IOCP).
