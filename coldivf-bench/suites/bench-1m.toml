# faiss IVF with its lists on disk, read ahead by 32 threads, the coarse table loaded at open, and the SQ8 rows mapped,
# on ColdIVF's partition and on faiss's own k-means at 2,560 per list.
#   cell flags: --variant ondisk --config cp320-rq1 --group faiss-ivf-ondisk
#               --dummy data/bench.noindex/bench-1m/faiss-ivf-ondisk/dummy320-rq1-n50000-s1
#   and         --variant ondisk --config vpl2560-rq1 --group faiss-ivf-ondisk-2560
