  # 0.95 verdict, the fastest cold of 3: recall@10 0.9542, warm p50 333 us, C0 p50 8.17 ms in 30 tune trials
  # It gets 300 trials, as the verdict cell.
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 128, rerank = 64 }
  split = "test"
  trials = 300
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.95 the cheaper point below it: recall@10 0.9442, warm p50 291 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 96, rerank = 64 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.99 not reached. The best is {"nprobe": 1024, "rerank": 200}, recall@10 0.9834, warm p50 1910 us

  [[system.warm]]
  config_id = "tl320"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 39 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 128, rerank = 64 },
    { nprobe = 96, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl320"
  split = "test"
  threads = 6
  qps_seconds = 10
  qps_repeats = 3
