# The head-to-head at 1M vectors on this Mac, on the first 1M rows of cohere10m-768-cosine: 768 dimensions with unit
# length, searched by cosine, and 1,000 queries, 500 tune ones at even positions and 500 test ones at odd positions.
# ColdIVF's design was tuned on Cohere 1M, another set, so these rows are held out. Their ground truth is the exact top
# 100 of every query with distances. It names the same 100 rows as an exact float64 search for every query, and the
# published 10M list, kept to these rows, opens it in the same order for every query.
#
# Every system fits at 1M, so every one runs, by the steps of bench-10m.toml, with grids sized for a 1M index. The
# faiss IVF setups, FastScan and RaBitQ-Library's IVF build on ColdIVF's partition, saved beside its index folder, so
# they run no k-means and compare on the same lists. faiss's batched and on-disk setups also run on its own k-means at
# 2,560 vectors per list. Every other system builds its own index. Each warm grid on the tune split runs from below
# recall@10 0.90 up to 0.99 or the system's ceiling, with at most 40 settings and neighbors at most 1.5 times apart.
#
# Disk. ColdIVF's index stays on disk for every batch. Every other system builds, runs and has its index folders
# deleted before the next one builds, so only one other index is on disk at a time.
#
# ColdIVF's own cells and its test-split warm entries run first, from coldivf-bench/py:
#   driver.py ../suites/bench-1m.toml --systems coldivf: --groups main --only warm,cold,refs
# ColdIVF through its Python module, the variant set against the other systems, takes the steps below on that index,
# with the group coldivf-python and the binaries' 200K dummy.
# Then each other system, in order:
#   1. driver.py ../suites/bench-1m.toml --systems NAME[:VARIANT] --only build --gate warn
#   2. driver.py ../suites/bench-1m.toml --systems NAME[:VARIANT] --only warm --gate warn
#   3. pick.py screen ../suites/bench-1m.toml --system NAME [--variant V] --config ID --group G [cell flags] --write,
#      then step 1 again, which builds the dummy a cell with dummy_n searches first
#   4. driver.py ../suites/bench-1m.toml --systems NAME[:VARIANT] --groups G --only cold,refs
#   5. pick.py verdict ../suites/bench-1m.toml --system NAME [--variant V] --config ID --group G [cell flags] --warm
#      --write
#   6. driver.py ../suites/bench-1m.toml --systems coldivf,NAME[:VARIANT] --groups G --only warm,cold,refs
#   7. Delete the system's index folders.
# Step 3 writes cells for the 3 cheapest settings that reach recall@10 0.90, 0.95 and 0.99 on the tune split, 30
# true-cold trials each, and step 4 times them. Step 5 writes, for each target, cells for the fastest of them cold, 100
# test trials at 0.95 and 30 at 0.90 and 0.99, with warm entries on the test split at those settings, and step 6 runs
# them. ColdIVF's module gets 300 trials at 0.95 and 100 at 0.90. Raise a cell's trials to 300 for ColdIVF's three
# closest rivals at 0.95. A system that reaches no target, or takes no search setting, gets its cells by hand at its
# best setting, as turbovec's, sqlite-vec's and the flat scan's are below. The cell flags of each system are above its
# section, and every group holds a ColdIVF cell at its 0.95 point, which runs beside the system's own cells in step 6.
#
# The tune grid only ranks settings, so it may run on a busy machine. Steps 4 and 6 and ColdIVF's batch time, so the
# gate is enforced, which needs $COLDIVF_BENCH_LOCKS, and they run as the machine's only heavy job. So do SymphonyQG's
# build, warm runs and cold cells, the only ones at 1M that hold more than 10 GB, with a 16 GB cap.

phase = "bench-1m"
dataset = "cohere10m-768-cosine"
n = 1000000
index_root = "data/bench.noindex/bench-1m"
truth = "data/cohere10m-768-cosine-1000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

# ColdIVF with two-level clustering and the cluster anchor at 320 vectors per list, 3,195 lists. Of the builds of
# bench-1m-coldivf.toml at 160, 320 and 640 per list, it was the fastest cold at 0.95 on the tune split. Its fastest
# true-cold (C0) p50 at 0.95 was 6.96 ms, at nprobe 128 and rerank 64, against 7.05 ms at 640 per list and 7.10 ms at
# 160, 30 trials each in the same rounds of one batch. Paired by query the three are within the trials' noise, and this
# setting is also the cheapest warm, 328 us, and reads the least, 8.4 MB. At 0.90 it was 5.39 ms, against 5.16 ms at 640
# and 4.98 ms at 160. That suite holds all three builds, grids and screens, and this build and grid are the same as its
# 320 build's, so their lines count here. Its recall@10 tops out near 0.984, so it can't reach 0.99, as at 10M, since
# its 8-bit rows hold one scale per vector.
[[system]]
name = "coldivf"
adapter = "coldivf"

  [[system.build]]
  config_id = "tl320"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.warm]]
  config_id = "tl320"
  split = "tune"
  grid = { nprobe = [24, 32, 48, 64, 96, 128, 192, 256, 384, 512], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 32, rerank = 20 },
    { nprobe = 48, rerank = 20 },
    { nprobe = 96, rerank = 100 },
    { nprobe = 128, rerank = 100 },
    { nprobe = 192, rerank = 100 },
    { nprobe = 256, rerank = 100 },
    { nprobe = 384, rerank = 100 },
    { nprobe = 512, rerank = 200 },
    { nprobe = 768, rerank = 200 },
    { nprobe = 1024, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  # ColdIVF's 0.95 point again in the group of every system it runs beside, so each of those batches holds a ColdIVF
  # cell too. Each is the same index under another build name, since a cell's trials count by its build and settings,
