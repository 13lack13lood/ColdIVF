# ColdIVF through its Python module, coldivf, in the adapter's process, as every other system runs through its binding,
# so its times hold the module's per-call cost as theirs hold their bindings'. It searches the binaries' index above,
# and its cold cells first search the same 200K dummy as the binaries' cells, as every other system's cells first
# search a dummy of their own config. Its numbers are the ones set against the other systems. The entry above runs the
# binaries, for comparing ColdIVF with itself. Build the module into venv-coldivf first with `maturin develop
# --release` in coldivf-python.
#   cell flags: --variant python --config tl320 --group coldivf-python
#               --dummy data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  [[system.build]]
  config_id = "tl320"
  index = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1"

  [[system.warm]]
  config_id = "tl320"
  split = "tune"
  grid = { nprobe = [24, 32, 48, 64, 96, 128, 192, 256, 384, 512], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 32, rerank = 20 },
    { nprobe = 48, rerank = 20 },
    { nprobe = 96, rerank = 100 },
    { nprobe = 128, rerank = 100 },
    { nprobe = 192, rerank = 100 },
    { nprobe = 256, rerank = 100 },
    { nprobe = 384, rerank = 100 },
    { nprobe = 512, rerank = 200 },
    { nprobe = 768, rerank = 200 },
    { nprobe = 1024, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  # 0.90 screen 1 of 3: recall@10 0.9116, warm p50 217 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 64, rerank = 39 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.90 screen 2 of 3: recall@10 0.9156, warm p50 237 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 96, rerank = 29 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.90 screen 3 of 3: recall@10 0.9244, warm p50 241 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 64, rerank = 64 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.95 screen 1 of 3: recall@10 0.9542, warm p50 333 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 128, rerank = 64 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.95 screen 2 of 3: recall@10 0.9592, warm p50 399 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 128, rerank = 100 }
  split = "tune"
