  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.95 screen 3 of 3: recall@10 0.9654, warm p50 430 us
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 192, rerank = 64 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # 0.99 not reached. The best is {"nprobe": 1024, "rerank": 200}, recall@10 0.9834, warm p50 1910 us

  # 0.90 verdict, the cheapest of 3 whose C0 median interval overlaps the fastest's, {"nprobe": 96, "rerank": 29} at 6.41 ms: recall@10 0.9116, warm p50 217 us, C0 p50 6.49 ms in 30 tune trials
  [[system.cold]]
  config_id = "tl320"
  params = { nprobe = 64, rerank = 39 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

