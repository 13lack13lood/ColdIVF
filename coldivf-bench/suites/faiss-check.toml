  config_id = "vpl160-rq1"
  split = "tune"
  passes = 1
  warmup = 200
  grid = { nprobe = [16, 32, 64], k_factor = [4] }

  [[system.cold]]
  config_id = "vpl160-rq1"
  params = { nprobe = 32, k_factor = 4 }
  trials = 3
  threads = 4
  dummy_n = 5000

[[system]]
name = "faiss-ivf"
adapter = "faiss_ivf"
variant = "graph"

