  [[system.warm]]
  config_id = "vpl160-rq1"
  split = "tune"
  passes = 1
  warmup = 200
  grid = { nprobe = [16, 32, 64], k_factor = [4], qb = [8] }

  [[system.cold]]
  config_id = "vpl160-rq1"
  params = { nprobe = 32, k_factor = 4, qb = 8 }
  trials = 3
  dummy_n = 5000

[[system]]
name = "faiss-hnsw"
adapter = "faiss_hnsw"

  [[system.build]]
  config_id = "hnsw32-sq8"
  config = { m = 32, storage = "sq8", ef_construction = 200 }
  threads = 4
  disk_gb = 1

  [[system.build]]
  config_id = "hnsw32-rq4-sq8"
  config = { m = 32, storage = "rabitq", bits = 4, refine = "sq8", ef_construction = 200 }
  threads = 4
  disk_gb = 1

  [[system.build]]
  config_id = "hnsw32-flat"
  config = { m = 32, storage = "flat", ef_construction = 200 }
  threads = 4
  disk_gb = 1

  [[system.warm]]
  config_id = "hnsw32-sq8"
  split = "tune"
  passes = 1
  warmup = 200
  grid = { ef_search = [16, 32, 64, 128] }

  [[system.warm]]
  config_id = "hnsw32-rq4-sq8"
  split = "tune"
  passes = 1
  warmup = 200
  grid = { ef_search = [16, 32, 64, 128], k_factor = [1, 2, 4] }

  [[system.warm]]
  config_id = "hnsw32-flat"
  split = "tune"
  passes = 1
  warmup = 200
  grid = { ef_search = [16, 32, 64, 128] }

  [[system.warm]]
  config_id = "hnsw32-sq8"
  split = "tune"
  threads = 4
  qps_seconds = 3
  qps_repeats = 1
  warmup = 200
  grid = { ef_search = [64] }

  [[system.cold]]
  config_id = "hnsw32-sq8"
  params = { ef_search = 64 }
  trials = 3
  dummy_n = 5000

  [[system.cold]]
  config_id = "hnsw32-rq4-sq8"
  params = { ef_search = 64, k_factor = 2 }
  trials = 3
  dummy_n = 5000

  [[system.cold]]
  config_id = "hnsw32-flat"
  params = { ef_search = 64 }
  trials = 3
  dummy_n = 5000

  [[system.cold]]
  config_id = "hnsw32-sq8"
  regime = "c1"
  params = { ef_search = 64 }
  trials = 3
  group = "live"
