  split = "tune"
  passes = 1
  warmup = 200
  grid = { nprobe = [16, 32, 64], k_factor = [4], quantizer_ef = [64, 128] }

  [[system.cold]]
  config_id = "vpl160-rq1-hnsw32"
  params = { nprobe = 32, k_factor = 4, quantizer_ef = 64 }
  trials = 3
  dummy_n = 5000

  [[system.cold]]
  config_id = "vpl160-rq1-hnsw32"
  regime = "c1"
  params = { nprobe = 32, k_factor = 4, quantizer_ef = 64 }
  trials = 3
  group = "live"

[[system]]
name = "faiss-ivf"
