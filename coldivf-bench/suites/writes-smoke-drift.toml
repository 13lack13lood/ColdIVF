# A smoke test of the drift pass, with the layout of bench-1m-writes-drift.toml at small scale. The base is the first
# 20,000 rows of cohere10m-768-cosine, and the drift stream inserts the 2,000 rows nearest 2 of the 20 topics that
# k-means finds among 200,000 later rows, in batches of 100. It checks the code, not the machine, so its gate only
# warns.
#
# From coldivf-bench/py:
#   python writes.py prepare ../suites/writes-smoke-drift.toml
#   driver.py ../suites/writes-smoke-drift.toml --systems coldivf:python,NAME[:VARIANT]

phase = "writes-smoke-drift"
dataset = "cohere10m-768-cosine"
n = 20000
index_root = "data/bench.noindex/writes-smoke-drift"
truth = "data/writes/cohere10m-768-cosine-wsmoke-s0.gt.ibin"
seed = 1
k = 10
max_attempts = 2

[gate]
mode = "warn"
top_samples = 2
top_interval_s = 2
invalid_vm = []

[writes]
stream = "data/writes/cohere10m-768-cosine-wsmoke-drift.stream"
pattern = "drift"
batch = 100
reserve_from = 22000
drift_from = 23300
drift_rows = 200000
topics = 20
hot_topics = 2
topic_sample = 20000
kmeans_rounds = 10
seed = 1
probes = 100

[writes.states]
d1 = { inserts = 200, deletes = 200 }
d5 = { inserts = 1000, deletes = 1000 }
d10 = { inserts = 2000, deletes = 2000 }

# ColdIVF through its Python module on the drift stream, with the main suite's maintenance actions. Its fresh build
# saves the partition the faiss IVF at 320 per list, FastScan and RaBitQ-Library IVF build their fresh indexes on.
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  [[system.build]]
  config_id = "tl320"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster" }
  threads = 4
  disk_gb = 1
  timeout_s = 7200

  # The head-to-head's build again, for the partition the faiss IVF at 320 per list, FastScan and RaBitQ-Library IVF
  # build on. Nothing searches it.
  [[system.build]]
  config_id = "tl320-partition"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  threads = 4
  disk_gb = 1
  timeout_s = 7200

  # Fresh, a build of the copy of D10's live rows, which saves its partition.
  [[system.build]]
  config_id = "tl320-fresh"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  data = "data/writes/cohere10m-768-cosine-wsmoke-drift-d10-live.base.fbin"
  threads = 4
  disk_gb = 1
  timeout_s = 7200

  [[system.write]]
  config_id = "tl320"
  role = "full"
  threads = 1
  states = ["d10"]

  [[system.maintain]]
  config_id = "tl320"
  actions = ["fold", "auto", "major", "job"]
  threads = 4
  action_threads = { job = 2 }
  params = { vectors_per_list = 320 }
  unsearched = ["job"]
  same_file = { job = "auto" }
  disk_gb = 1

  # D10 and each maintained state at both picks.
  [[system.warm]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]
  findability = true

  [[system.cold]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "coldivf"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  params = { nprobe = 64, rerank = 39 }
  trials = 3
  group = "coldivf"
  dummy_n = 2000

  # The fresh build, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "tl320-fresh"
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "coldivf"
  dummy = "data/bench.noindex/writes-smoke-drift/coldivf-python/tl320-n20000-s1-dummy2000"

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 64, rerank = 39 }
  trials = 3
  group = "coldivf"
  dummy = "data/bench.noindex/writes-smoke-drift/coldivf-python/tl320-n20000-s1-dummy2000"

  # ColdIVF's cell at D10 and 0.95 in each other system's group.

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "lancedb"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "qdrant-edge"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "rabitq-ivf"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "faiss-ivf"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "faiss-ivf-2560"
  dummy_n = 2000

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 3
  group = "faiss-fastscan"
  dummy_n = 2000


# LanceDB's IVF_RQ at 1 bit, whose optimize adds new rows to the partitions it has and whose retrain trains them again.
[[system]]
name = "lancedb"
adapter = "lancedb"
python = "${COLDIVF_BENCH_VENVS}/venv-lance13/bin/python3"

  [[system.build]]
  config_id = "rq1-default"
  config = { index = "ivf_rq", bits = 1 }
  threads = 4
  disk_gb = 6
  timeout_s = 3600

  # Fresh, a build of the copy of D10's live rows.
  [[system.build]]
  config_id = "rq1-default-fresh"
  config = { index = "ivf_rq", bits = 1 }
  data = "data/writes/cohere10m-768-cosine-wsmoke-drift-d10-live.base.fbin"
  threads = 4
  disk_gb = 6
  timeout_s = 3600

  [[system.write]]
  config_id = "rq1-default"
  role = "full"
  threads = 1
  states = ["d10"]

  [[system.maintain]]
  config_id = "rq1-default"
  actions = ["optimize", "retrain"]
  threads = 4
  disk_gb = 8

  # D10 and each maintained state at both picks.
  [[system.warm]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]
  findability = true

  [[system.cold]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  params = { nprobes = 16, refine_factor = 8 }
  trials = 3
  group = "lancedb"
  threads = 10
  dummy_n = 2000

  [[system.cold]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  params = { nprobes = 12, refine_factor = 4 }
  trials = 3
  group = "lancedb"
  threads = 10
  dummy_n = 2000

  # The fresh build, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "rq1-default-fresh"
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 16, refine_factor = 8 }
  trials = 3
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-smoke-drift/lancedb/rq1-default-n20000-s1-dummy2000"

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 12, refine_factor = 4 }
  trials = 3
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-smoke-drift/lancedb/rq1-default-n20000-s1-dummy2000"


