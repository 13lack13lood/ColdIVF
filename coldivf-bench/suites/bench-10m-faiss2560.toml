# A second partition for faiss's inverted file (IVF) index in the 10M head-to-head of bench-10m.toml: faiss's own
# k-means at 2,560 vectors per list, 3,906 lists, the coarsest size of the shared grid of 160, 640 and 2,560 per list.
# The faiss setups in bench-10m.toml search ColdIVF's partition at 640 per list. An open with on-disk lists copies its
# coarse table of 15,687 centroids, 48 MB, into memory, and one with batched reads reads that table ahead, and lists 4
# times as long make the table 4 times smaller. This file builds and times the two setups that were fastest cold at
# 640, batched reads and on-disk lists, by the steps of bench-10m.toml, with a cell of ColdIVF through its Python module
# at its 0.95 point in each group. It writes to the bench-10m phase, so its lines sit beside the head-to-head's, and its
# builds, grids and cells go into bench-10m.toml once they are timed, so its report holds them.
#
# Run from coldivf-bench/py, with V and G the variant and group of one setup, and D its dummy:
#   driver.py ../suites/bench-10m-faiss2560.toml --systems faiss-ivf:shipped --only build --gate warn
#   driver.py ../suites/bench-10m-faiss2560.toml --systems faiss-ivf:batched --only warm --gate warn
#   pick.py screen ../suites/bench-10m-faiss2560.toml --system faiss-ivf --variant V --config vpl2560-rq1 --group G
#     --dummy D --write
#   driver.py ../suites/bench-10m-faiss2560.toml --systems faiss-ivf:V --groups G --only cold,refs
#   pick.py verdict ../suites/bench-10m-faiss2560.toml --system faiss-ivf --variant V --config vpl2560-rq1 --warm
#     --write
#   driver.py ../suites/bench-10m-faiss2560.toml --groups G --only warm,cold,refs
# and the same for the on-disk setup, which builds a file of its own. The cold stages enforce the timing gate, which
# reads the job gate's lock folder from $COLDIVF_BENCH_LOCKS.

phase = "bench-10m"
dataset = "cohere10m-768-cosine"
n = 10000000
index_root = "data/bench.noindex/bench-10m"
truth = "data/cohere10m-768-cosine-10000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

# ColdIVF through its Python module, at its 0.95 point in each group, so each batch holds a ColdIVF cell.
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  # ColdIVF's 0.95 point in each group of this file, so each batch holds a ColdIVF cell.
  [[system.build]]
  config_id = "tl640-vs-faiss-ivf-2560"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-ivf-2560"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-ivf-2560"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-faiss-ivf-ondisk-2560"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-ivf-ondisk-2560"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-ivf-ondisk-2560"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"


# faiss IVF over 1-bit RaBitQ codes with SQ8 rows to rescore, in one mapped file, as faiss ships it, which the batched
# setup below searches. Its own trials don't run here.
[[system]]
name = "faiss-ivf"
adapter = "faiss_ivf"
variant = "shipped"

  [[system.build]]
  config_id = "vpl2560-rq1"
  config = { vectors_per_list = 2560, bits = 1 }
  threads = 10
  disk_gb = 10
  timeout_s = 10800

  # The dummy the batched setup's cold cells search first.
  [[system.build]]
  config_id = "dummy2560-rq1"
  config = { vectors_per_list = 2560, bits = 1 }
  n = 50000
  threads = 10
  disk_gb = 1
  timeout_s = 1800

# faiss IVF as shipped, with the probed lists and then the candidates' rows read ahead in two batched waves. faiss has
# no such setup. It only shows what batched reads gain.
#   cell flags: --variant batched --config vpl2560-rq1 --group faiss-ivf-2560
#               --dummy data/bench.noindex/bench-10m/faiss-ivf-shipped/dummy2560-rq1-n50000-s1
[[system]]
name = "faiss-ivf"
adapter = "faiss_ivf"
variant = "batched"

  [[system.build]]
  config_id = "vpl2560-rq1"
  index = "data/bench.noindex/bench-10m/faiss-ivf-shipped/vpl2560-rq1-n10000000-s1"

  [[system.warm]]
  config_id = "vpl2560-rq1"
  split = "tune"
  grid = { nprobe = [12, 16, 24, 32, 48, 64, 96, 128, 192, 256], k_factor = [2, 4, 8, 16], qb = [4] }
  passes = 3
  warmup = 1000
  timeout_s = 7200

  # 0.90 screen 1 of 3: recall@10 0.9180, warm p50 2639 us
  [[system.cold]]
  config_id = "vpl2560-rq1"
  params = { nprobe = 24, k_factor = 4, qb = 4 }
  split = "tune"
  trials = 30
  group = "faiss-ivf-2560"
  dummy = "data/bench.noindex/bench-10m/faiss-ivf-shipped/dummy2560-rq1-n50000-s1"

  # 0.90 screen 2 of 3: recall@10 0.9232, warm p50 2718 us
