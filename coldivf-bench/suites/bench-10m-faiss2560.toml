  # 0.90 verdict, the cheapest of 3 whose C0 median interval overlaps the fastest's, {"k_factor": 8, "nprobe": 24, "qb": 4} at 18.26 ms: recall@10 0.9180, warm p50 2639 us, C0 p50 18.44 ms in 30 tune trials
