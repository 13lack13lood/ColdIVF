  # 0.95 screen 2 of 3: recall@10 0.9562, warm p50 5190 us
  [[system.cold]]
  config_id = "vpl2560-rq1"
  params = { nprobe = 48, k_factor = 16, qb = 4 }
  split = "tune"
  trials = 30
