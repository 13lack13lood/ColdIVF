# A smoke test of the whole harness at 50K on the dev set. Every adapter builds one index at its default settings, with
# only the settings it needs and has no default for filled in, runs a warm grid of 5 settings (1 where a system has no
# search setting) and 5 true-cold (C0) trials, and every system that has the disk-resident steady state (C1) runs 5
# trials of it too. Both drift references run at the start and the end. It checks the code, not the machine, so its
# gate only warns, swap leaves points valid, and builds use 4 threads to share the machine.
#
# Every C0 cell first searches a 5K dummy of its own config, as the full runs do with a 50K one. ColdIVF's binaries
# search no dummy and have no C1, so its cells leave both out. Run the driver with the research environment's Python, and
# set $COLDIVF_BENCH_VENVS to the folder that holds venv-lance13, the environment of lancedb 0.40 with pylance 13.

phase = "smoke"
dataset = "cohere-768-cosine"
n = 50000
index_root = "data/bench.noindex/smoke"

[gate]
mode = "warn"
top_samples = 2
top_interval_s = 2
invalid_vm = []

[refs]
mode = "on"
wave_trials = 10
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }
coldivf_trials = 10

[[system]]
name = "coldivf"
adapter = "coldivf"

  [[system.build]]
  config_id = "tl160"
  config = { clustering = "two-level", vectors_per_list = 160 }
  threads = 4
  disk_gb = 1
  timeout_s = 900

  [[system.warm]]
  config_id = "tl160"
  grid = { nprobe = [8, 16, 32, 64, 128], rerank = [39] }
  timeout_s = 1800

  [[system.cold]]
  config_id = "tl160"
  params = { nprobe = 32, rerank = 39 }
  trials = 5

[[system]]
name = "faiss-ivf"
adapter = "faiss_ivf"

  [[system.build]]
  config_id = "vpl160-rq1"
  config = { vectors_per_list = 160, bits = 1 }
  threads = 4
  disk_gb = 1
  timeout_s = 900

  [[system.warm]]
  config_id = "vpl160-rq1"
  grid = { nprobe = [8, 16, 32, 64, 128], k_factor = [4] }
  passes = 2
  warmup = 200
  timeout_s = 1800

  [[system.cold]]
  config_id = "vpl160-rq1"
  params = { nprobe = 32, k_factor = 4 }
  trials = 5
  dummy_n = 5000

  [[system.cold]]
  config_id = "vpl160-rq1"
  regime = "c1"
  params = { nprobe = 32, k_factor = 4 }
  trials = 5
  group = "live"

