# Lance's cold cells use its default compute pool, 10 threads on this 12-core Mac.
[[system]]
name = "lancedb"
adapter = "lancedb"
python = "${COLDIVF_BENCH_VENVS}/venv-lance13/bin/python3"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 4
  disk_gb = 1
  timeout_s = 900

  [[system.warm]]
  config_id = "default"
  grid = { nprobes = [8, 16, 32, 64, 128], refine_factor = [4] }
  passes = 2
  warmup = 200
  timeout_s = 1800

  [[system.cold]]
  config_id = "default"
  params = { nprobes = 32, refine_factor = 4 }
  trials = 5
  threads = 10
  dummy_n = 5000

  [[system.cold]]
  config_id = "default"
  regime = "c1"
  params = { nprobes = 32, refine_factor = 4 }
  trials = 5
  threads = 10
  group = "live"

