# ColdIVF's three builds for the 1M head-to-head in bench-1m.toml, on the first 1M rows of cohere10m-768-cosine:
# two-level clustering with the cluster anchor at 160, 320 and 640 vectors per list, the three sizes the 1M
# configuration may take. Each gets the same tuning budget, one build and 40 warm settings on the tune split, with 10
# values of nprobe at most 1.5 times apart and the settings that reach recall@10 0.90 to its ceiling. A list at 640
# holds 4 times the vectors of one at 160, so its grid starts and ends at lower nprobe. Its true-cold (C0) cells then
# time the three cheapest settings by warm p50 that reach each target on the tune split, 30 trials each, all three
# builds in the same rounds of one batch. The build that is fastest cold at 0.95 goes to bench-1m.toml, and the others
# are deleted. All of them write to the bench-1m phase, so their lines sit beside the head-to-head's.
#
# Run from coldivf-bench/py, one stage at a time:
#   driver.py ../suites/bench-1m-coldivf.toml --only build --gate warn
#   driver.py ../suites/bench-1m-coldivf.toml --only warm --gate warn
#   pick.py screen ../suites/bench-1m-coldivf.toml --system coldivf --config ID --dummy-n 200000 --write, per build
#   driver.py ../suites/bench-1m-coldivf.toml --only build --gate warn, which builds the 200K dummies
#   driver.py ../suites/bench-1m-coldivf.toml --only cold,refs
# The cold stage enforces the timing gate, which reads the job gate's lock folder from $COLDIVF_BENCH_LOCKS.

phase = "bench-1m"
dataset = "cohere10m-768-cosine"
n = 1000000
index_root = "data/bench.noindex/bench-1m"
truth = "data/cohere10m-768-cosine-1000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

[[system]]
name = "coldivf"
adapter = "coldivf"

  [[system.build]]
  config_id = "tl160"
  config = { clustering = "two-level", vectors_per_list = 160, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.build]]
  config_id = "tl320"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.build]]
  config_id = "tl640"
  config = { clustering = "two-level", vectors_per_list = 640, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.warm]]
  config_id = "tl160"
  split = "tune"
  grid = { nprobe = [32, 48, 64, 96, 128, 192, 256, 384, 512, 768], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 48, rerank = 20 }, { nprobe = 64, rerank = 20 }, { nprobe = 128, rerank = 100 },
    { nprobe = 192, rerank = 100 }, { nprobe = 256, rerank = 100 }, { nprobe = 384, rerank = 100 },
    { nprobe = 512, rerank = 100 }, { nprobe = 768, rerank = 200 }, { nprobe = 1024, rerank = 200 },
    { nprobe = 1536, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  [[system.warm]]
  config_id = "tl320"
  split = "tune"
  grid = { nprobe = [24, 32, 48, 64, 96, 128, 192, 256, 384, 512], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 32, rerank = 20 }, { nprobe = 48, rerank = 20 }, { nprobe = 96, rerank = 100 },
    { nprobe = 128, rerank = 100 }, { nprobe = 192, rerank = 100 }, { nprobe = 256, rerank = 100 },
    { nprobe = 384, rerank = 100 }, { nprobe = 512, rerank = 200 }, { nprobe = 768, rerank = 200 },
    { nprobe = 1024, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  [[system.warm]]
  config_id = "tl640"
  split = "tune"
  grid = { nprobe = [16, 24, 32, 48, 64, 96, 128, 192, 256, 384], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 24, rerank = 20 }, { nprobe = 32, rerank = 20 }, { nprobe = 64, rerank = 100 },
    { nprobe = 96, rerank = 100 }, { nprobe = 128, rerank = 100 }, { nprobe = 192, rerank = 100 },
    { nprobe = 256, rerank = 100 }, { nprobe = 384, rerank = 200 }, { nprobe = 512, rerank = 200 },
    { nprobe = 768, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  # 0.90 screen 1 of 3: recall@10 0.9006, warm p50 201 us
  [[system.cold]]
  config_id = "tl160"
  params = { nprobe = 64, rerank = 39 }
  split = "tune"
  trials = 30
  dummy_n = 200000

  # 0.90 screen 2 of 3: recall@10 0.9082, warm p50 233 us
  [[system.cold]]
