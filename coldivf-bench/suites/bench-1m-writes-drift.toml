# RaBitQ-Library's IVF at 5 bits on ColdIVF's partition, whose lists stay as the build made them.
[[system]]
name = "rabitq-ivf"
adapter = "rabitq_ivf"
# Each add copies the whole index, and macOS malloc's cache of freed blocks kept the old copies in the footprint, which
# grew past the 16 GB cap at 100,000 inserts in one session with memory compressing through every timed call. With the
# cache off the process holds only its index and the copy an add makes.
env = { MallocLargeCache = "0" }

  [[system.build]]
  config_id = "cp320-b5"
  config = { bits = 5 }
  clusters = "data/bench.noindex/writes-1m-drift/coldivf-python/tl320-partition-n1000000-s1.clusters/partition"
  threads = 10
  disk_gb = 2
  timeout_s = 10800

  [[system.build]]
  config_id = "dummy320-b5"
  config = { bits = 5, vectors_per_list = 320 }
  n = 50000
  threads = 10
  disk_gb = 1
  timeout_s = 1800

  # Fresh, a build of the copy of D10's live rows.
  [[system.build]]
  config_id = "cp320-b5-fresh"
  config = { bits = 5 }
  data = "data/writes/cohere10m-768-cosine-w1m-drift-d10-live.base.fbin"
  clusters = "data/bench.noindex/writes-1m-drift/coldivf-python/tl320-fresh-n1000000-s1.clusters/partition"
  threads = 10
  disk_gb = 2
  timeout_s = 10800

  [[system.write]]
  config_id = "cp320-b5"
  role = "full"
  threads = 1
  states = ["d10"]

  # D10 and each maintained state at both picks.
  [[system.warm]]
  config_id = "cp320-b5"
  states = ["d10"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 192 }, { nprobe = 64 }]
  findability = true

  [[system.cold]]
  config_id = "cp320-b5"
  states = ["d10"]
  params = { nprobe = 192 }
  trials = 30
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/writes-1m-drift/rabitq-ivf/dummy320-b5-n50000-s1"

  [[system.cold]]
