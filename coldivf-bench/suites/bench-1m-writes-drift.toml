# The drift pass of the write benchmark at 1M, a smaller second pass after bench-1m-writes.toml, for the systems with
# clusters or maintenance. Its stream makes the joint ladder's rounds, but its 100,000 inserts are rows from 1,101,300
# on, past the main stream's inserts and the latency runs' reserved rows, nearest 10 of the 200 topics that k-means
# finds in 100,000 of those rows. Its deletes are drawn as the main stream's are. It runs to D10 only, with maintenance
# and a fresh build of D10's live rows. The inserts aren't in row order, so each one's id is the next number, which
# maps to its row through the stream.
#
# From coldivf-bench/py, make the stream, D10's truth and the copy of its live rows, then run each system as in
# bench-1m-writes.toml, with the gt binary built first:
#   python writes.py prepare ../suites/bench-1m-writes-drift.toml
#   driver.py ../suites/bench-1m-writes-drift.toml --systems NAME[:VARIANT] --only build,stream,maintain
#   driver.py ../suites/bench-1m-writes-drift.toml --systems NAME[:VARIANT] --only warm
#   driver.py ../suites/bench-1m-writes-drift.toml --systems coldivf:python,NAME[:VARIANT] --groups G --only cold,refs

phase = "writes-1m-drift"
dataset = "cohere10m-768-cosine"
n = 1000000
index_root = "data/bench.noindex/writes-1m-drift"
truth = "data/cohere10m-768-cosine-1000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

[writes]
stream = "data/writes/cohere10m-768-cosine-w1m-drift.stream"
pattern = "drift"
batch = 1000
reserve_from = 1100000
drift_from = 1101300
topics = 200
hot_topics = 10
topic_sample = 100000
kmeans_rounds = 20
seed = 1

# The joint ladder's rounds, of which the write entries keep D10 only.
[writes.states]
d1 = { inserts = 10000, deletes = 10000 }
d5 = { inserts = 50000, deletes = 50000 }
d10 = { inserts = 100000, deletes = 100000 }

# ColdIVF through its Python module on the drift stream, with the main suite's maintenance actions. Its fresh build
# saves the partition the faiss IVF at 320 per list, FastScan and RaBitQ-Library IVF build their fresh indexes on.
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  # The head-to-head's index, which no write touches. S0 is a clone of it.
  [[system.build]]
  config_id = "tl320"
  index = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1"

  # The head-to-head's build again, for the partition the faiss IVF at 320 per list, FastScan and RaBitQ-Library IVF
  # build on. Nothing searches it.
  [[system.build]]
  config_id = "tl320-partition"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  # Fresh, a build of the copy of D10's live rows, which saves its partition.
  [[system.build]]
  config_id = "tl320-fresh"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  data = "data/writes/cohere10m-768-cosine-w1m-drift-d10-live.base.fbin"
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.write]]
  config_id = "tl320"
  role = "full"
  threads = 1
  states = ["d10"]

  [[system.maintain]]
  config_id = "tl320"
  actions = ["fold", "auto", "major", "job"]
  threads = 10
  action_threads = { job = 2 }
  params = { vectors_per_list = 320 }
  unsearched = ["job"]
  same_file = { job = "auto" }
  disk_gb = 5

  # D10 and each maintained state at both picks.
  [[system.warm]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]
  findability = true

  [[system.cold]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10", "d10-fold", "d10-auto", "d10-major"]
  params = { nprobe = 64, rerank = 39 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # The fresh build, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "tl320-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 64, rerank = 39 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # ColdIVF's cell at D10 and 0.95 in each other system's group.

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "lancedb"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "qdrant-edge"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "faiss-ivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "faiss-ivf-2560"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = ["d10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "faiss-fastscan"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"


# LanceDB's IVF_RQ at 1 bit, whose optimize adds new rows to the partitions it has and whose retrain trains them again.
[[system]]
name = "lancedb"
adapter = "lancedb"
python = "${COLDIVF_BENCH_VENVS}/venv-lance13/bin/python3"

  [[system.build]]
  config_id = "rq1-default"
  config = { index = "ivf_rq", bits = 1 }
  threads = 10
  disk_gb = 6
  timeout_s = 3600

  # Fresh, a build of the copy of D10's live rows.
  [[system.build]]
  config_id = "rq1-default-fresh"
  config = { index = "ivf_rq", bits = 1 }
  data = "data/writes/cohere10m-768-cosine-w1m-drift-d10-live.base.fbin"
  threads = 10
  disk_gb = 6
  timeout_s = 3600

  [[system.write]]
  config_id = "rq1-default"
  role = "full"
  threads = 1
  states = ["d10"]

  [[system.maintain]]
  config_id = "rq1-default"
  actions = ["optimize", "retrain"]
  threads = 10
  disk_gb = 8

  # D10 and each maintained state at both picks.
  [[system.warm]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]
  findability = true

  [[system.cold]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  params = { nprobes = 16, refine_factor = 8 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy_n = 50000

  [[system.cold]]
  config_id = "rq1-default"
  states = ["d10", "d10-optimize", "d10-retrain"]
  params = { nprobes = 12, refine_factor = 4 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy_n = 50000

  # The fresh build, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "rq1-default-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 16, refine_factor = 8 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-1m-drift/lancedb/rq1-default-n1000000-s1-dummy50000"

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 12, refine_factor = 4 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-1m-drift/lancedb/rq1-default-n1000000-s1-dummy50000"


