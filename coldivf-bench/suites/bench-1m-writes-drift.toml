  # The fresh build, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "cp320-b5-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 192 }, { nprobe = 64 }]

  [[system.cold]]
  config_id = "cp320-b5-fresh"
  params = { nprobe = 192 }
  trials = 30
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/writes-1m-drift/rabitq-ivf/dummy320-b5-n50000-s1"

  [[system.cold]]
  config_id = "cp320-b5-fresh"
  params = { nprobe = 64 }
  trials = 30
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/writes-1m-drift/rabitq-ivf/dummy320-b5-n50000-s1"


