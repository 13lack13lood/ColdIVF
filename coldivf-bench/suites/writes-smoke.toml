[[system]]
name = "astervec"
adapter = "astervec_lsm"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 4
  disk_gb = 4
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "default-fresh"
  config = {}
  data = "data/writes/cohere10m-768-cosine-wsmoke-s10-live.base.fbin"
  threads = 4
  disk_gb = 4
  timeout_s = 7200

  [[system.write]]
  config_id = "default"
  role = "full"
  threads = 1

  # Every state at both picks.
  [[system.warm]]
  config_id = "default"
  states = "all"
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ ef = 384 }, { ef = 96 }]
  findability = true

  # The picks' neighbors in the head-to-head grid, so warm latency interpolates to the targets.
  [[system.warm]]
  config_id = "default"
  states = ["s10", "s10i"]
  split = "test"
  passes = 1
  warmup = 100
  settings = [
    { ef = 256 },
    { ef = 512 },
    { ef = 64 },
    { ef = 128 },
  ]

  [[system.cold]]
  config_id = "default"
  states = "all"
