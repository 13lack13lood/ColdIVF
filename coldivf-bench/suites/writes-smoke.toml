# 16 GB cap.
[[system]]
name = "symphonyqg"
adapter = "symphonyqg"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 4
  disk_gb = 12
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "default-fresh"
  config = {}
  data = "data/writes/cohere10m-768-cosine-wsmoke-s10-live.base.fbin"
  threads = 4
  disk_gb = 12
  timeout_s = 7200

  # Every state at both picks.
  [[system.warm]]
  config_id = "default"
  states = ["s0"]
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ ef = 128 }, { ef = 64 }]

  [[system.cold]]
  config_id = "default"
  states = ["s0"]
  params = { ef = 128 }
  trials = 3
  group = "symphonyqg"
  dummy_n = 2000

  [[system.cold]]
  config_id = "default"
  states = ["s0"]
  params = { ef = 64 }
  trials = 3
  group = "symphonyqg"
  dummy_n = 2000

  # The fresh build default-fresh, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "default-fresh"
  split = "test"
  passes = 1
  warmup = 100
  settings = [{ ef = 128 }, { ef = 64 }]

  [[system.cold]]
  config_id = "default-fresh"
  params = { ef = 128 }
  trials = 3
  group = "symphonyqg"
  dummy = "data/bench.noindex/writes-smoke/symphonyqg/default-n20000-s1-dummy2000"

  [[system.cold]]
  config_id = "default-fresh"
  params = { ef = 64 }
  trials = 3
  group = "symphonyqg"
  dummy = "data/bench.noindex/writes-smoke/symphonyqg/default-n20000-s1-dummy2000"


# Paimon's IVF-RQ, rebuild only: the 8-bit build at nprobe 48 for 0.95 and the 4-bit build at nprobe 48 for 0.90.
[[system]]
name = "paimon"
adapter = "paimon"

  [[system.build]]
  config_id = "b8"
  config = { bits = 8, train_rows = 20000 }
  threads = 4
  disk_gb = 2
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "b8-fresh"
  config = { bits = 8, train_rows = 20000 }
  data = "data/writes/cohere10m-768-cosine-wsmoke-s10-live.base.fbin"
  threads = 4
  disk_gb = 2
  timeout_s = 7200

  [[system.build]]
  config_id = "b4"
  config = { bits = 4, train_rows = 20000 }
  threads = 4
  disk_gb = 2
