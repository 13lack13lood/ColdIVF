# RaBitQ-Library's IVF at 5 bits on ColdIVF's partition, with full writes through add and remove on the loaded index.
# Its durable point saves the whole file. Its fresh build takes the partition of ColdIVF's fresh build.
[[system]]
name = "rabitq-ivf"
adapter = "rabitq_ivf"

  [[system.build]]
  config_id = "cp320-b5"
  config = { bits = 5 }
  clusters = "data/bench.noindex/writes-smoke/coldivf-python/tl320-n20000-s1.clusters/partition"
  threads = 4
  disk_gb = 2
