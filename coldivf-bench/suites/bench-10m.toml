# The head-to-head at 10M vectors on this Mac, on cohere10m-768-cosine: 10M rows of 768 dimensions with unit length,
# searched by cosine, and 1,000 queries, 500 tune ones at even positions and 500 test ones at odd positions. Its ground
# truth is the exact top 100 of every query with their distances, which matches the published list in every query's
# top 10, in order.
#
# Every system here builds, holds and serves 10M vectors within this machine's limits. Of its 36 GB of memory (RAM), a
# job may use 16 GB and a warm working set ~24 GB, and an index must fit the free disk beside the 30.7 GB base with 40
# GB to spare. These don't fit, by their 1M builds scaled 10 times.
# - qdrant-edge: warm, it needs ~39 GB, its 7.7 GB of codes in memory plus 30.7 GB of originals, more than the whole
#   36 GB. Its shard is 40.4 GB (4.04 GB at 1M), more than the free disk held, and it takes ~112 GB of disk while it
#   builds with its write-ahead log.
# - DiskANN: a build in one piece holds all 30.7 GB of rows and a 2.6 GB graph in memory, over the 16 GB a job may use.
#   A build in shards within that adds shard files to its 41.9 GB disk index (4.19 GB at 1M), more than the free disk
#   held.
# - SymphonyQG: ~65 GB in memory to serve (6.53 GB at 1M), and ~101 GB to build (10.1 GB at 1M).
# - AsterVec: its bulk build holds every float32 row in memory, ~47 GB (4.73 GB at 1M).
# - RaBitQ-Library's hierarchical navigable small world (HNSW) graph: ~7 GB of its own (0.71 GB at 1M), but its build
#   reads float32 rows at random, so it needs the whole 30.7 GB base cached too, ~38 GB in all.
# - usearch with 16-bit float (f16) rows: its build holds ~17.8 GB (1.78 GB at 1M), 15.4 GB of rows and the graph,
#   over the 16 GB a job may use, though under the 36 GB of RAM. Its 8-bit integer (i8) rows fit, and run here.
# - faiss HNSW with float32 rows, 33 GB in memory, and RaBitQ-Library's inverted file index (IVF) over raw float32
#   rows, 30.7 GB.
# - faiss HNSW with 4-bit RaBitQ codes and 8-bit scalar quantized (SQ8) rows: 676 bytes per vector of graph and codes
#   plus 768 of rows, ~14.4 GB at 10M, so its build would peak near 14.7 GB, within ~1.3 GB of the 16 GB a job may use.
#   It is left out as too close to that cap. faiss HNSW over SQ8 alone, 10.4 GB, runs here.
# - sqlite-vec and an exact scan: every query reads all ~31 GB, so neither can be warm, and a warm query would take
#   ~5 s.
#
# Disk. ColdIVF's index stays on disk for every batch. Every other system builds, runs and has its index folders
# deleted before the next one builds, so only one other large index is on disk at a time. The faiss IVF setups, the
# FastScan index and RaBitQ-Library build on ColdIVF's partition, saved beside its index folder, so they run no k-means
# and compare on the same lists. LanceDB's table holds its own copy of the 30.7 GB of rows, so it runs last and alone.
# The disk had room for it beside ColdIVF's index, so its batch has a ColdIVF cell too.
#
# ColdIVF's own cells and its test-split warm entries run first, from coldivf-bench/py:
#   driver.py ../suites/bench-10m.toml --systems coldivf: --groups main --only warm,cold,refs
# ColdIVF through its Python module, the variant set against the other systems, takes the steps below on that index,
# with the group coldivf-python.
# Then each other system, in order:
#   1. driver.py ../suites/bench-10m.toml --systems NAME[:VARIANT] --only build --gate warn
#   2. driver.py ../suites/bench-10m.toml --systems NAME[:VARIANT] --only warm --gate warn
#   3. pick.py screen ../suites/bench-10m.toml --system NAME [--variant V] --config ID --group G [cell flags] --write,
#      then step 1 again, which builds the dummy a cell with dummy_n searches first
#   4. driver.py ../suites/bench-10m.toml --systems NAME[:VARIANT] --groups G --only cold,refs
#   5. pick.py verdict ../suites/bench-10m.toml --system NAME [--variant V] --config ID --group G [cell flags] --warm
#      --write
#   6. driver.py ../suites/bench-10m.toml --systems coldivf,NAME[:VARIANT] --groups G --only warm,cold,refs
#   7. Delete the system's index folders.
# Step 3 writes cells for the 3 cheapest settings that reach recall@10 0.90, 0.95 and 0.99 on the tune split, 30
# true-cold trials each, and step 4 times them. Step 5 writes, for each target, cells for the fastest of them cold, 100
# test trials, and for the cheaper setting just below it, with warm entries on the test split at those settings, and
# step 6 runs them. Raise a cell's trials to 300 for ColdIVF's three closest rivals at 0.95. A system that reaches no
# target gets its cells by hand, at its best setting, as turbovec's are. The cell flags of each system are above its
# section, and every group holds a ColdIVF cell at its 0.95 point, which runs beside the system's own cells in step 6.
#
# The tune grid only ranks settings, so it may run on a busy machine. Steps 4 and 6 and ColdIVF's batch time, so the
# gate is enforced, which needs $COLDIVF_BENCH_LOCKS, and they run as the machine's only heavy job. So do the builds,
# warm runs and cold cells of every system that holds more than 10 GB, with a 16 GB cap: the faiss IVF builds, FastScan,
# RaBitQ-Library at 9 bits, Paimon at 8 bits, usearch, faiss HNSW and LanceDB.

phase = "bench-10m"
dataset = "cohere10m-768-cosine"
n = 10000000
index_root = "data/bench.noindex/bench-10m"
truth = "data/cohere10m-768-cosine-10000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

# ColdIVF with two-level clustering and the cluster anchor at 640 vectors per list, 15,687 lists in 128 groups. It
# was faster cold at 0.95 on the tune split than 160 per list. Its fastest true-cold (C0) p50 at 0.95 was 9.79 ms,
# nprobe 192 and rerank 39, against 15.18 ms at 160 per list, nprobe 256 and rerank 100, 30 trials each. At 0.90 it
# was 6.76 ms against 10.98 ms. The two stage suites, bench-10m-coldivf-tl160.toml and bench-10m-coldivf-tl640.toml,
# hold both builds, grids and screens, and this build and grid are the same as the 640 stage's, so their lines count
# here. A rebuild gives the same file. Its recall@10 tops out near 0.986, so it can't reach 0.99. Its 8-bit rows hold
# each vector's offset from the mean with one scale per vector, set by its largest value, and this data has a few wide
# dimensions, so most values get only ~10 of the 127 levels. Rescoring each test query's true top 100 with these rows
# gives recall@10 0.987, against 0.994 with one scale per dimension, as faiss's SQ8 rows have, and 0.996 with the same
# rows after a random rotation.
[[system]]
name = "coldivf"
adapter = "coldivf"

  [[system.build]]
  config_id = "tl640"
  config = { clustering = "two-level", vectors_per_list = 640, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 31
  timeout_s = 7200

  [[system.warm]]
  config_id = "tl640"
  split = "tune"
  grid = { nprobe = [32, 48, 64, 96, 128, 192, 256, 384, 512, 768], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 96, rerank = 20 }, { nprobe = 128, rerank = 20 }, { nprobe = 192, rerank = 100 },
    { nprobe = 256, rerank = 100 }, { nprobe = 384, rerank = 100 }, { nprobe = 512, rerank = 100 },
    { nprobe = 768, rerank = 100 }, { nprobe = 1024, rerank = 200 }, { nprobe = 1536, rerank = 200 },
    { nprobe = 2048, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  # 0.90 verdict, the fastest cold of 3: recall@10 0.9078, warm p50 415 us, C0 p50 6.76 ms in 30 tune trials
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 64, rerank = 29 }
  split = "test"
  trials = 100
  dummy_n = 200000

  # 0.90 the cheaper point below it: recall@10 0.8984, warm p50 380 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 48, rerank = 39 }
  split = "test"
  trials = 100
  dummy_n = 200000

  # 0.95 verdict, the fastest cold of 3: recall@10 0.9522, warm p50 812 us, C0 p50 9.79 ms in 30 tune trials. It
  # gets 300 trials, as the verdict cell.
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 300
  dummy_n = 200000

  # 0.95 the cheaper point below it: recall@10 0.9468, warm p50 668 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 128, rerank = 64 }
  split = "test"
  trials = 100
  dummy_n = 200000

  # 0.99 not reached. The best is {"nprobe": 2048, "rerank": 200}, recall@10 0.9856, warm p50 6579 us

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  threads = 6
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  threads = 12
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  # ColdIVF's 0.95 verdict point again in the group of every system it runs beside, so each of those batches holds
  # a ColdIVF cell too. Each is the same index under another build name, since a cell's trials count by its build
  # and settings, not by its group.
  [[system.build]]
  config_id = "tl640-vs-faiss-ivf"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-ivf"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-ivf"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-faiss-ivf-ondisk"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-ivf-ondisk"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-ivf-ondisk"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-faiss-ivf-graph"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-ivf-graph"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-ivf-graph"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-faiss-fastscan"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-fastscan"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-fastscan"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-rabitq-ivf"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-rabitq-ivf"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-paimon"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-paimon"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "paimon"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-usearch"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-usearch"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "usearch"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-faiss-hnsw"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-faiss-hnsw"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "faiss-hnsw"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-turbovec"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-turbovec"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "turbovec"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  [[system.build]]
  config_id = "tl640-vs-lancedb"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-lancedb"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "lancedb"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # The binaries' 0.95 point in the Python batch, so ColdIVF's two ways of running time side by side.
  [[system.build]]
  config_id = "tl640-vs-python"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-vs-python"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # The binaries' test-split warm entries again, with the machine's swap-ins and compressions counted over each
  # warm binary's run, which the first ones didn't count.
  [[system.build]]
  config_id = "tl640-vmcheck"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.warm]]
  config_id = "tl640-vmcheck"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640-vmcheck"
  split = "test"
  threads = 6
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640-vmcheck"
  split = "test"
  threads = 12
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]



# ColdIVF through its Python module, coldivf, in the adapter's process, as every other system runs through its binding,
# so its times hold the module's per-call cost as theirs hold their bindings'. It searches the binaries' index above,
# and its cold cells first search the same 200K dummy as the binaries' cells, as every other system's cells first
# search a dummy of their own config. Its numbers are the ones set against the other systems. The entry above runs the
# binaries, for comparing ColdIVF with itself. Build the module into venv-coldivf first with `maturin develop
# --release` in coldivf-python.
#   cell flags: --variant python --config tl640 --group coldivf-python
#               --dummy data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  [[system.build]]
  config_id = "tl640"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.warm]]
  config_id = "tl640"
  split = "tune"
  grid = { nprobe = [32, 48, 64, 96, 128, 192, 256, 384, 512, 768], rerank = [29, 39, 64] }
  settings = [
    { nprobe = 96, rerank = 20 }, { nprobe = 128, rerank = 20 }, { nprobe = 192, rerank = 100 },
    { nprobe = 256, rerank = 100 }, { nprobe = 384, rerank = 100 }, { nprobe = 512, rerank = 100 },
    { nprobe = 768, rerank = 100 }, { nprobe = 1024, rerank = 200 }, { nprobe = 1536, rerank = 200 },
    { nprobe = 2048, rerank = 200 },
  ]
  passes = 3
  warmup = 1000
  timeout_s = 5400

  # 0.90 screen 1 of 3: recall@10 0.9078, warm p50 396 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 64, rerank = 29 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.90 screen 2 of 3: recall@10 0.9036, warm p50 404 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 48, rerank = 64 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.90 screen 3 of 3: recall@10 0.9152, warm p50 411 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 64, rerank = 39 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.95 screen 1 of 3: recall@10 0.9522, warm p50 769 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 192, rerank = 39 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.95 screen 2 of 3: recall@10 0.9604, warm p50 815 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 192, rerank = 64 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.95 screen 3 of 3: recall@10 0.9634, warm p50 883 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 192, rerank = 100 }
  split = "tune"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.99 not reached. The best is {"nprobe": 2048, "rerank": 200}, recall@10 0.9856, warm p50 6554 us

  # 0.90 verdict, the fastest cold of 3: recall@10 0.9078, warm p50 396 us, C0 p50 7.81 ms in 30 tune trials
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 64, rerank = 29 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.90 the cheaper point below it: recall@10 0.8984, warm p50 366 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 48, rerank = 39 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.95 verdict, the fastest cold of 3: recall@10 0.9522, warm p50 769 us, C0 p50 11.07 ms in 30 tune trials. It gets 300 trials, as the verdict cell.
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 300
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.95 the cheaper point below it: recall@10 0.9468, warm p50 653 us
  [[system.cold]]
  config_id = "tl640"
  params = { nprobe = 128, rerank = 64 }
  split = "test"
  trials = 100
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"

  # 0.99 not reached. The best is {"nprobe": 2048, "rerank": 200}, recall@10 0.9856, warm p50 6554 us

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  threads = 6
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  [[system.warm]]
  config_id = "tl640"
  split = "test"
  threads = 12
  qps_seconds = 10
  qps_repeats = 3
  warmup = 1000
  settings = [
    { nprobe = 64, rerank = 29 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 192, rerank = 39 },
    { nprobe = 128, rerank = 64 },
  ]

  # The fresh-clone control: 30 trials at the 0.95 verdict setting, each on a new APFS clone of the index
  # that no cache has seen.
  [[system.build]]
  config_id = "tl640-clone"
  index = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1"

  [[system.cold]]
  config_id = "tl640-clone"
  params = { nprobe = 192, rerank = 39 }
  split = "test"
  trials = 30
  group = "coldivf-python"
  dummy = "data/bench.noindex/bench-10m/coldivf/tl640-n10000000-s1-dummy200000"
  fresh_clone = true

