# LanceDB's IVF_RQ at 1 bit, with Lance's own partitions, rescored from the table's float32 rows. Its table holds a
# copy of every row, ~32 GB in all, so it runs last and alone, beside ColdIVF's index. Warm runs in mode
# "index", with the index files cached and the table left on disk, apart from the rows the warm-up queries rescore. Its
# cold cells run on Lance's default pool of 10 threads.
#   cell flags: --config rq1-default --group lancedb --threads 10 --dummy-n 50000
[[system]]
name = "lancedb"
adapter = "lancedb"
python = "${COLDIVF_BENCH_VENVS}/venv-lance13/bin/python3"

  [[system.build]]
  config_id = "rq1-default"
  config = { index = "ivf_rq", bits = 1 }
  threads = 10
  disk_gb = 31
  timeout_s = 10800

  [[system.warm]]
  config_id = "rq1-default"
  split = "tune"
  mode = "index"
  grid = { nprobes = [12, 16, 24, 32, 48, 64, 96, 128, 192, 256], refine_factor = [4, 8, 16, 32] }
  passes = 3
  warmup = 200
  timeout_s = 14400

  # 0.90 screen 1 of 3: recall@10 0.9748, warm p50 5225 us
  [[system.cold]]
  config_id = "rq1-default"
  params = { nprobes = 64, refine_factor = 8 }
  split = "tune"
  trials = 30
  group = "lancedb"
  threads = 10
  dummy_n = 50000

