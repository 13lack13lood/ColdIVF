# turbovec's flat scan of 4-bit TurboQuant codes, plain and with the library's calibration on 100K rows. It takes no
# search setting, and at 1M its recall@10 was 0.872, so it reaches none of the targets. Its cells are written here, 30
# trials each since it loads whole at open, ~3.9 GB at 10M.
[[system]]
name = "turbovec"
adapter = "turbovec"

  [[system.build]]
  config_id = "b4"
  config = { bits = 4 }
  threads = 10
  disk_gb = 4
  timeout_s = 3600

  [[system.build]]
  config_id = "b4-cal"
  config = { bits = 4, calibrate = 100000 }
  threads = 10
  disk_gb = 4
  timeout_s = 3600

  [[system.warm]]
  config_id = "b4"
  split = "tune"
  settings = [{}]
  passes = 3
  warmup = 200
  timeout_s = 3600

  [[system.warm]]
  config_id = "b4-cal"
  split = "tune"
  settings = [{}]
  passes = 3
  warmup = 200
  timeout_s = 3600

  [[system.cold]]
  config_id = "b4"
  params = {}
