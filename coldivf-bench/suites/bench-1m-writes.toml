# LanceDB's IVF_RQ at 1 bit, with full writes through Table.add and Table.delete, one commit per call. Searches keep
# Lance's default, which scans the rows it hasn't indexed yet. Its actions are Table.optimize() and
# Table.optimize(retrain=True). Its cold cells run on Lance's default pool of 10 threads, as in the head-to-head.
[[system]]
name = "lancedb"
adapter = "lancedb"
python = "${COLDIVF_BENCH_VENVS}/venv-lance13/bin/python3"

  [[system.build]]
  config_id = "rq1-default"
  config = { index = "ivf_rq", bits = 1 }
  threads = 10
  disk_gb = 6
  timeout_s = 3600

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "rq1-default-fresh"
  config = { index = "ivf_rq", bits = 1 }
  data = "data/writes/cohere10m-768-cosine-w1m-s10-live.base.fbin"
  threads = 10
  disk_gb = 6
  timeout_s = 3600

  [[system.write]]
  config_id = "rq1-default"
  role = "full"
  threads = 1

  [[system.maintain]]
  config_id = "rq1-default"
  actions = ["optimize", "retrain"]
  threads = 10
  disk_gb = 8

  # Every state at both picks.
  [[system.warm]]
  config_id = "rq1-default"
  states = "all"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]
  findability = true

  # The picks' neighbors in the head-to-head grid, so warm latency interpolates to the targets.
  [[system.warm]]
  config_id = "rq1-default"
  states = ["s10", "s10i", "s10-optimize", "s10-retrain"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobes = 12, refine_factor = 8 },
    { nprobes = 24, refine_factor = 8 },
    { nprobes = 8, refine_factor = 4 },
    { nprobes = 16, refine_factor = 4 },
  ]

  [[system.cold]]
  config_id = "rq1-default"
  states = "all"
  params = { nprobes = 16, refine_factor = 8 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy_n = 50000

  [[system.cold]]
  config_id = "rq1-default"
  states = "all"
  params = { nprobes = 12, refine_factor = 4 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy_n = 50000

  # The fresh build rq1-default-fresh, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "rq1-default-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobes = 16, refine_factor = 8 }, { nprobes = 12, refine_factor = 4 }]

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 16, refine_factor = 8 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-1m/lancedb/rq1-default-n1000000-s1-dummy50000"

  [[system.cold]]
  config_id = "rq1-default-fresh"
  params = { nprobes = 12, refine_factor = 4 }
  trials = 30
  group = "lancedb"
  threads = 10
  dummy = "data/bench.noindex/writes-1m/lancedb/rq1-default-n1000000-s1-dummy50000"


# qdrant-edge's shard with its head-to-head config, one segment with 8-bit codes in memory, and full writes through
# upsert_points and delete_points. Its one action, optimize(), rebuilds the whole graph with that config.
[[system]]
name = "qdrant-edge"
adapter = "qdrant_shard"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 10
  disk_gb = 12
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "default-fresh"
  config = {}
  data = "data/writes/cohere10m-768-cosine-w1m-s10-live.base.fbin"
  threads = 10
  disk_gb = 12
  timeout_s = 7200

  [[system.write]]
  config_id = "default"
  role = "full"
  threads = 1

  [[system.maintain]]
  config_id = "default"
  actions = ["optimize"]
  threads = 10
  disk_gb = 12

  # Every state at both picks.
  [[system.warm]]
  config_id = "default"
  states = "all"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ hnsw_ef = 256, oversampling = 2 }, { hnsw_ef = 96, oversampling = 2 }]
  findability = true

  # The picks' neighbors in the head-to-head grid, so warm latency interpolates to the targets.
  [[system.warm]]
  config_id = "default"
  states = ["s10", "s10i", "s10-optimize"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { hnsw_ef = 192, oversampling = 2 },
    { hnsw_ef = 384, oversampling = 2 },
    { hnsw_ef = 64, oversampling = 2 },
    { hnsw_ef = 128, oversampling = 2 },
  ]

  [[system.cold]]
  config_id = "default"
  states = "all"
  params = { hnsw_ef = 256, oversampling = 2 }
  trials = 30
  group = "qdrant-edge"
  dummy_n = 50000

  [[system.cold]]
  config_id = "default"
  states = "all"
  params = { hnsw_ef = 96, oversampling = 2 }
  trials = 30
  group = "qdrant-edge"
  dummy_n = 50000

  # The fresh build default-fresh, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "default-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ hnsw_ef = 256, oversampling = 2 }, { hnsw_ef = 96, oversampling = 2 }]

  [[system.cold]]
  config_id = "default-fresh"
  params = { hnsw_ef = 256, oversampling = 2 }
  trials = 30
  group = "qdrant-edge"
  dummy = "data/bench.noindex/writes-1m/qdrant-edge/default-n1000000-s1-dummy50000"

  [[system.cold]]
  config_id = "default-fresh"
  params = { hnsw_ef = 96, oversampling = 2 }
  trials = 30
  group = "qdrant-edge"
  dummy = "data/bench.noindex/writes-1m/qdrant-edge/default-n1000000-s1-dummy50000"


# sqlite-vec's exact scan of float32 rows, with full writes as INSERT and DELETE, one transaction per call. Its recall
