[[system]]
name = "sqlite-vec"
adapter = "sqlite_vec"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 10
  disk_gb = 5
  timeout_s = 3600

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "default-fresh"
  config = {}
  data = "data/writes/cohere10m-768-cosine-w1m-s10-live.base.fbin"
  threads = 10
  disk_gb = 5
  timeout_s = 3600

  [[system.write]]
  config_id = "default"
  role = "full"
  threads = 1

  [[system.maintain]]
  config_id = "default"
  actions = ["vacuum"]
  threads = 10
  disk_gb = 5

  # Every state at both picks.
  [[system.warm]]
  config_id = "default"
  states = "all"
  split = "test"
  passes = 1
  warmup = 10
  settings = [{}]

  [[system.cold]]
  config_id = "default"
  states = "all"
  params = {}
  trials = 30
  group = "sqlite-vec"
  dummy_n = 50000

  # The fresh build default-fresh, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "default-fresh"
  split = "test"
  passes = 1
  warmup = 10
  settings = [{}]

  [[system.cold]]
  config_id = "default-fresh"
  params = {}
  trials = 30
  group = "sqlite-vec"
  dummy = "data/bench.noindex/writes-1m/sqlite-vec/default-n1000000-s1-dummy50000"


# AsterVec's log-structured merge (LSM) graph with its default caches, and full writes of one id per call. Its durable
# point is close, timed with the reopen after it. It has no maintenance action, since RocksDB compacts on its own.
[[system]]
name = "astervec"
adapter = "astervec_lsm"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 10
  disk_gb = 4
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows.
  [[system.build]]
  config_id = "default-fresh"
