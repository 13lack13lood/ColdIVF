# The write benchmark at 1M on this Mac. Every system takes one stream of inserts and deletes on its build of the 1M
# head-to-head, the first 1M rows of cohere10m-768-cosine, with the builds and picks of bench-1m.toml. The stream
# inserts rows 1,000,000 to 1,099,999 in row order, so every insert's id is its row, and deletes 100,000 ids drawn at
# random with seed 1 from the vectors live at the start of each round. Its three rounds leave S1, S5 and S10 on the
# joint ladder, with 1%, 5% and 10% of the base in pending inserts and as many pending deletes, and S1i, S5i and S10i
# on the inserts-only ladder. Each state's truth is the exact top 100 over the vectors it holds.
#
# Make the stream, every state's truth and the copy of S10's live rows first, from coldivf-bench/py. The truths run in
# the gt binary, so build it first with cargo build --release -p coldivf-bench --bin gt --target-dir target/mine.
#   python writes.py prepare ../suites/bench-1m-writes.toml
# Then ColdIVF, whose fresh build saves the partition three other systems' fresh builds take, and whose S0 and S10
# stay for the other systems' groups. Then each other system, in order:
#   1. driver.py ../suites/bench-1m-writes.toml --systems NAME[:VARIANT] --only build,stream,latency,maintain
#   2. driver.py ../suites/bench-1m-writes.toml --systems NAME[:VARIANT] --only warm
#   3. driver.py ../suites/bench-1m-writes.toml --systems coldivf:python,NAME[:VARIANT] --groups G --only cold,refs
#   4. Delete the system's folders under data/bench.noindex/writes-1m.
# Every step times something, so the gate is enforced, which needs $COLDIVF_BENCH_LOCKS, and each step runs as the
# machine's only heavy job. SymphonyQG's build and searches hold ~10 GB, so they run alone under the 16 GB cap.

phase = "writes-1m"
dataset = "cohere10m-768-cosine"
n = 1000000
index_root = "data/bench.noindex/writes-1m"
truth = "data/cohere10m-768-cosine-1000000.gt.ibin"
seed = 1
k = 10
max_attempts = 3

[gate]
mode = "enforce"
max_wait_s = 7200

[refs]
mode = "on"
coldivf_index = "data/cohere-50k.coldivf"
coldivf_dataset = "cohere-768-cosine"
coldivf_n = 50000
coldivf_params = { nprobe = 32, rerank = 39 }

[writes]
stream = "data/writes/cohere10m-768-cosine-w1m.stream"
inserts_from = 1000000
batch = 1000
latency_states = ["s0", "s10"]
latency_calls = 1000
warmup_calls = 100
durable_calls = 200
saves = 5
reserve_from = 1100000
seed = 1

# Each state's inserts and deletes since S0. The inserts-only states replay the stream without its deletes, and s10p
# makes s10's calls with a maintenance run whenever one is due.
[writes.states]
s1 = { inserts = 10000, deletes = 10000 }
s5 = { inserts = 50000, deletes = 50000 }
s10 = { inserts = 100000, deletes = 100000 }
s1i = { inserts = 10000, deletes = 0 }
s5i = { inserts = 50000, deletes = 0 }
s10i = { inserts = 100000, deletes = 0 }
s10p = { inserts = 100000, deletes = 100000, policy = "auto" }

# ColdIVF through its Python module, with full writes through coldivf.Writer: tl320, two-level clustering with the
# cluster anchor at 320 vectors per list, 3,195 lists at 1M. Its write entry keeps both ladders and S10p, which makes
# S10's calls with a maintenance run of kind auto whenever its policy says one is due. Every maintenance action takes
# the build's 320 vectors per list, since the module's default is 160. The job runs at the module's own 2 threads and
# throttled, as an app's background job does, and the other actions at 10. The job's file must match the auto run's,
# since both are a run of kind auto with the same seed, so only the job's run is timed and nothing searches it.
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  # The head-to-head's index, which no write touches. S0 is a clone of it.
  [[system.build]]
  config_id = "tl320"
  index = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1"

  # The head-to-head's build again, for the partition the faiss IVF at 320 per list, FastScan and RaBitQ-Library
  # IVF build on, which the head-to-head's index folder no longer has beside it. Nothing searches it.
  [[system.build]]
  config_id = "tl320-partition"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  # Fresh, a build of the copy of S10's live rows. It runs first and saves its partition, since the faiss
  # IVF at 320 per list, FastScan and RaBitQ-Library IVF build their fresh indexes on it.
  [[system.build]]
  config_id = "tl320-fresh"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster", export_clusters = true }
  data = "data/writes/cohere10m-768-cosine-w1m-s10-live.base.fbin"
  threads = 10
  disk_gb = 5

  # Fresh-i, a build of S10i's vectors, the first rows of the dataset.
  [[system.build]]
  config_id = "tl320-fresh-i"
  config = { clustering = "two-level", vectors_per_list = 320, anchor = "cluster" }
  n = 1100000
  threads = 10
  disk_gb = 5
  timeout_s = 7200

  [[system.write]]
  config_id = "tl320"
  role = "full"
  threads = 1
  states = ["s1", "s5", "s10", "s1i", "s5i", "s10i", "s10p"]

  [[system.maintain]]
  config_id = "tl320"
  actions = ["fold", "auto", "major", "job"]
  threads = 10
  action_threads = { job = 2 }
  params = { vectors_per_list = 320 }
  unsearched = ["job"]
  same_file = { job = "auto" }
  disk_gb = 5

  # Every state at both picks.
  [[system.warm]]
  config_id = "tl320"
  states = "all"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]
  findability = true

  # The picks' neighbors in the head-to-head grid, so warm latency interpolates to the targets.
  [[system.warm]]
  config_id = "tl320"
  states = ["s10", "s10i", "s10-fold", "s10-auto", "s10-major"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { nprobe = 96, rerank = 64 },
    { nprobe = 192, rerank = 64 },
    { nprobe = 48, rerank = 39 },
    { nprobe = 96, rerank = 39 },
  ]

  [[system.cold]]
  config_id = "tl320"
  states = "all"
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320"
  states = "all"
  params = { nprobe = 64, rerank = 39 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # The fresh build tl320-fresh, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "tl320-fresh"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320-fresh"
  params = { nprobe = 64, rerank = 39 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # The fresh build tl320-fresh-i, as a head-to-head build is searched.
  [[system.warm]]
  config_id = "tl320-fresh-i"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ nprobe = 128, rerank = 64 }, { nprobe = 64, rerank = 39 }]

  [[system.cold]]
  config_id = "tl320-fresh-i"
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  [[system.cold]]
  config_id = "tl320-fresh-i"
  params = { nprobe = 64, rerank = 39 }
  trials = 30
  group = "coldivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"

  # ColdIVF's cell at S10 and 0.95 in each other system's group, as each head-to-head group held one.
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "lancedb"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "qdrant-edge"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "sqlite-vec"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "astervec"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "usearch"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "rabitq-ivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "rabitq-hnsw"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "turbovec"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "faiss-ivf"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
  config_id = "tl320"
  states = ["s10"]
  params = { nprobe = 128, rerank = 64 }
  trials = 30
  group = "faiss-ivf-2560"
  dummy = "data/bench.noindex/bench-1m/coldivf/tl320-n1000000-s1-dummy200000"
  [[system.cold]]
