  params = { ef = 96 }
  trials = 30
  group = "astervec"
  dummy = "data/bench.noindex/writes-1m/astervec/default-n1000000-s1-dummy50000"


# usearch's HNSW at M 16 with 16-bit float (f16) rows, with full writes through add and remove on the loaded index. Its
# durable point saves the whole file to a temporary file and renames it. It has no maintenance action.
[[system]]
name = "usearch"
adapter = "usearch_hnsw"

  [[system.build]]
  config_id = "f16-m16"
  config = { dtype = "f16" }
  threads = 10
  disk_gb = 3
