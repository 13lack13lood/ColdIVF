# The exact reference: the flat scan, whose writes the harness makes. It takes S0 and every state of both ladders, warm
# only, and its recall must be 1.000 at each.
[[system]]
name = "flat"
adapter = "flat"

  [[system.build]]
  config_id = "default"
  config = {}
  threads = 10
  disk_gb = 5
  timeout_s = 1800

  [[system.write]]
  config_id = "default"
  role = "exact"
  threads = 1

  # Every state of both ladders, whose recall must be 1.000, which checks each state's truth.
  [[system.warm]]
  config_id = "default"
  states = "all"
  split = "test"
  passes = 1
  warmup = 200
  settings = [{}]
  findability = true
