  threads = 10
  disk_gb = 4
  timeout_s = 7200

  [[system.write]]
  config_id = "default"
  role = "full"
  threads = 1

  # Every state at both picks.
  [[system.warm]]
  config_id = "default"
  states = "all"
  split = "test"
  passes = 3
  warmup = 1000
  settings = [{ ef = 384 }, { ef = 96 }]
  findability = true

  # The picks' neighbors in the head-to-head grid, so warm latency interpolates to the targets.
  [[system.warm]]
  config_id = "default"
  states = ["s10", "s10i"]
  split = "test"
  passes = 3
  warmup = 1000
  settings = [
    { ef = 256 },
    { ef = 512 },
    { ef = 64 },
    { ef = 128 },
  ]

  [[system.cold]]
  config_id = "default"
  states = "all"
  params = { ef = 384 }
  trials = 30
  group = "astervec"
  dummy_n = 50000

  [[system.cold]]
