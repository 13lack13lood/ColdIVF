# A smoke test of the whole harness at the 1M prefix of Cohere 10M. Every adapter builds one index at its default
# settings, with only the settings it needs and has no default for filled in, then runs a warm grid of 5 settings (1
# where a system has no search setting) and 5 true-cold (C0) trials. It checks the code, not the machine, so its gate
# only warns, swap leaves points valid, and builds use 4 threads to share the machine.
#
# Run it one system at a time with --systems, and delete that system's indexes before the next, since disk holds only
# one large index at a time. Every C0 cell first searches a 5K dummy of its own config. ColdIVF's binaries search no
# dummy, so its cell leaves it out. Run the driver with the research environment's Python, and set $COLDIVF_BENCH_VENVS
# to the folder that holds venv-lance13, the environment of lancedb 0.40 with pylance 13.

phase = "smoke"
dataset = "cohere10m-768-cosine"
n = 1000000
index_root = "data/bench.noindex/smoke"

[gate]
mode = "warn"
top_samples = 2
top_interval_s = 2
invalid_vm = []

[[system]]
name = "coldivf"
adapter = "coldivf"

  [[system.build]]
  config_id = "tl160"
  config = { clustering = "two-level", vectors_per_list = 160 }
  threads = 4
  disk_gb = 5
  timeout_s = 1800

  [[system.warm]]
  config_id = "tl160"
  grid = { nprobe = [16, 32, 64, 128, 256], rerank = [39] }
  timeout_s = 1800

  [[system.cold]]
  config_id = "tl160"
  params = { nprobe = 64, rerank = 39 }
  trials = 5

# ColdIVF through its Python module, in the adapter's process as every other system runs, so its times hold a binding's
# per-call cost as theirs do, and its cold cell first searches a 5K dummy of its own config, as theirs do. The entry
# above runs the binaries, for comparing ColdIVF with itself. Build the module into venv-coldivf first with
# `maturin develop --release` in coldivf-python.
[[system]]
name = "coldivf"
variant = "python"
adapter = "coldivf_py"
python = "${COLDIVF_BENCH_VENVS}/venv-coldivf/bin/python3"

  [[system.build]]
  config_id = "tl160"
  config = { clustering = "two-level", vectors_per_list = 160 }
  threads = 4
  disk_gb = 5
  timeout_s = 1800

  [[system.warm]]
  config_id = "tl160"
  grid = { nprobe = [16, 32, 64, 128, 256], rerank = [39] }
  passes = 2
  warmup = 200
  timeout_s = 1800

  [[system.cold]]
  config_id = "tl160"
  params = { nprobe = 64, rerank = 39 }
  trials = 5
  dummy_n = 5000

