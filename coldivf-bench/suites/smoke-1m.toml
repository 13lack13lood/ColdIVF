# usearch stores f16 rows here, as the head-to-head does. Its default i8 rows cap recall@10 near 0.84 at 1M, below every
# target the warm leaderboard ranks at.
[[system]]
name = "usearch"
adapter = "usearch_hnsw"

  [[system.build]]
  config_id = "f16-m16"
  config = { dtype = "f16" }
  threads = 4
  disk_gb = 3
  timeout_s = 2700

  [[system.warm]]
  config_id = "f16-m16"
  grid = { expansion_search = [16, 32, 64, 128, 256] }
  passes = 2
  warmup = 200
  timeout_s = 1800

  [[system.cold]]
  config_id = "f16-m16"
  params = { expansion_search = 64 }
  trials = 5
  dummy_n = 5000

