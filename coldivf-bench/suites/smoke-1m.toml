# turbovec, sqlite-vec's exact scan and flat take no search setting, so their warm grids hold one setting. An exact scan
# reads all 3.07 GB of float32 rows per query, so those two warm runs are short.
[[system]]
name = "turbovec"
adapter = "turbovec"

  [[system.build]]
  config_id = "b4"
  config = { bits = 4 }
  threads = 4
  disk_gb = 1
  timeout_s = 1800

  [[system.warm]]
  config_id = "b4"
  settings = [{}]
  passes = 2
  warmup = 200
  timeout_s = 1800

  [[system.cold]]
  config_id = "b4"
  params = {}
  trials = 5
  dummy_n = 5000

