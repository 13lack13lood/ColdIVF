[package]
name = "coldivf-bench"
description = "Benchmarks of ColdIVF: datasets, ground truth, cold-cache tools and the timing harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
coldivf = { workspace = true, features = ["inmem", "bench"] }
# memmap2: maps the datasets, so nothing loads until it's read.
memmap2 = "0.9.11"

[target.'cfg(unix)'.dependencies]
# libc: msync (macOS) and posix_fadvise (Linux) for eviction, mincore for residency, proc_pid_rusage for the macOS
# counters, and the raw reads of the wave check.
libc = "0.2.190"
